name: codex-review
# Stand-in for the reviewer's verdict on the probe: GitHub Actions writes
# the codex-review status on each pull request head.
on:
  pull_request:
permissions:
  statuses: write
jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f context=codex-review -f state=success -f description="probe stand-in"
