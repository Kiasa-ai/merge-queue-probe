# drill: a comment at the top
name: ci
# Probe copy of the shape that matters: pull_request plus queue pushes,
# one job named ci-status, one cancelling group for queue pushes.
# The job runs every *.test.mjs with Node's test runner. On a failure it
# leaves the queue's comment as an annotation titled merge-queue-comment,
# naming each failed file and linking the run.
on:
  pull_request:
  push:
    branches:
      - 'merge-queue/main/**'
      - 'merge-queue-fresh/main/**'
  # A full run on main, as Kiasa's scheduled and manual runs; `fail: yes` makes it red on purpose.
  workflow_dispatch:
    inputs:
      fail:
        description: "yes: this full run fails on purpose"
        default: "no"
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-merge-queue' || format('ci-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true
jobs:
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tests
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAIL_ON_PURPOSE: ${{ inputs.fail }}
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          if [ "$FAIL_ON_PURPOSE" = yes ]; then echo "a red full run, on purpose"; exit 1; fi
          failed=""
          for f in $(find . -name '*.test.mjs' -not -path './.git/*' | sort); do
            if node --test "$f" > out.txt 2>&1; then echo "ok $f"; else
              cat out.txt
              why=$(grep -m1 -E 'Error' out.txt | tr -d '`%' | cut -c1-160)
              failed="$failed%0A- \`${f#./}\`: \`$why\`"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error title=merge-queue-comment::**The queue's batch failed** in [this run]($RUN_URL).%0A%0A**ci-status**: failure$failed"
            exit 1
          fi
